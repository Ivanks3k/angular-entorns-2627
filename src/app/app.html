<main>
  <section class="catalogue" aria-labelledby="catalogue-title">
    <header class="catalogue-header">
      <p class="eyebrow">La nostra botiga</p>
      <h1 id="catalogue-title">{{ title() }}</h1>
      <p class="intro">Descobreix els nostres productes i les seves ofertes.</p>
    </header>

    <div class="products">
      @for (product of products; track product.id) {
        <app-tarjeta [product]="product"></app-tarjeta>
      }
    </div>
  </section>
</main>

<router-outlet />
